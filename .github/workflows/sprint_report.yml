name: Sprint Highlights Report

on:
  # Add schedule entries only in a private deployment fork. Action logs in a
  # public repository can expose operational metadata when a request fails.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post-sprint-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --require-hashes --requirement requirements.txt

      - name: Generate sprint highlights report
        env:
          JIRA_DOMAIN: ${{ secrets.JIRA_DOMAIN }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PULSE_FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: python pulse_report.py
