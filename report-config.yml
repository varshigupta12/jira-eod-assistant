version: 1

teams:
  - id: platform
    name: Platform
    projects: [PLAT]
    filters: ["Platform delivery board"]
    release_labels: [platform-team]
    boards: [101]
    daily:
      format: epic
      time: "17:00"
      timezone: America/New_York

  - id: services
    name: Services
    projects: [SVC]
    filters: ["Services sprint board"]
    release_labels: [services-team]
    boards: [202]
    daily:
      format: status
      time: "17:00"
      timezone: Europe/London

  - id: mobile
    name: Mobile
    projects: [APP]
    filters: ["Mobile delivery board"]
    release_labels: [mobile-team]
    boards: [303]
    daily:
      format: assignee
      time: "18:00"
      timezone: Asia/Kolkata

ai:
  enabled: true
  model: openai/gpt-5-mini
  max_tokens: 2048

pulse:
  enabled: true
  title: Engineering Sprint Pulse
  timezone: America/New_York
  weekday: friday
  time: "20:00"
  cadence_days: 14
  anchor_date: "2026-01-09"

release_blockers:
  enabled: true
  label: "2026.1"

delivery_metrics:
  enabled: true
  lookback_days: 30
  aging_wip_days: 5
  snapshot_dir: metrics
  dashboard_path: delivery-dashboard.html
  # Replace with your Jira site's Sprint custom field to enable carry-over.
  sprint_field: customfield_10020

blocked_statuses: [Blocked, Impediment]
deploy_statuses: [To Be Deployed, Ready for Deployment, Ready to Deploy]
done_statuses: [Done, Closed, Resolved]
review_statuses: [In Review, Code Review]
